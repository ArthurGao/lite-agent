# S5b baseline (lite-agent design §15): the task set on local Ollama models, three runs per task.
# Free, but slow: check nothing else is evaluating on Ollama first
# (`pgrep -fl lite-eval`), one run at a time.
#   uv run lite-eval run eval/lite-eval/suites/agent-ollama.yaml
name: agent-ollama
dataset: ../datasets/agent
repeats: 3
timeout_s: 600  # the long task on qwen3:8b: nine turns and its summaries
concurrency: 1  # one request at a time: the seconds per task are the model's, not a queue's
targets:
  - python: lite_agent.eval_target:agent
    configs:
      # greedy (lite-model's Ollama default, what a host gets): the three runs come out the same
      - {name: qwen3-8b, backend: ollama, model: "qwen3:8b", reasoning_effort: none}
      - {name: qwen3-1.7b, backend: ollama, model: "qwen3:1.7b", reasoning_effort: none}
      # sampled at the models' own default temperature: the spread between runs is the noise
      - {name: qwen3-8b-t0.6, backend: ollama, model: "qwen3:8b", reasoning_effort: none, temperature: 0.6}
      - {name: qwen3-1.7b-t0.6, backend: ollama, model: "qwen3:1.7b", reasoning_effort: none, temperature: 0.6}
      # thinking on (design §16: Ollama's reasoning is not passed back between tool turns)
      - {name: qwen3-8b-think, backend: ollama, model: "qwen3:8b", reasoning_effort: medium}
scorers:
  - exact_match: {field: done, expected: done}
