[project]
name = "lite-agent"
version = "0.2.4"
description = "An agent harness library: a tool loop over lite-model roles, recorded in an append-only event log"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
# lite-model is the only sibling imported at run time (AGENTS.md rule 8): `turn()` and its types.
# It is a direct URL in the metadata, not a [tool.uv.sources] entry: lite-model is not on PyPI, and
# the wheel must install on its own (a sources entry does not reach the wheel's metadata; lite-cache
# S1.5). pydantic is pinned to the version lite-model pins.
dependencies = [
    "lite-model @ https://github.com/ArthurGao/lite-model/releases/download/v0.8.0/lite_model-0.8.0-py3-none-any.whl",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "typer==0.27.3",  # the CLI; the same as lite-cache and lite-mem
]

[project.scripts]
liteagent = "lite_agent.cli:main"

[project.optional-dependencies]
# The PostgreSQL session store (design §15 S4); the same psycopg as lite-cache and lite-mem.
pg = [
    "psycopg[binary,pool]==3.3.8",
]
# The S5 evaluation runs on lite-eval (design §15), installed from a release wheel in
# [tool.uv.sources], the version lite-mem and llm-steward pin: an upgrade re-runs
# tests/integration/test_eval_target.py.
eval = [
    "lite-eval",
]
# The HTTP shell (design §10, S6): `liteagent serve`. The versions lite-mem pins.
server = [
    "fastapi==0.162.2",
    "uvicorn==0.54.0",
]
# The durable runner (design §9, S7): Temporal workflows and activities. Tests run on the
# SDK's time-skipping test server, which it downloads once.
temporal = [
    "temporalio==1.36.1",
]

[dependency-groups]
dev = [
    "lite-agent[pg,eval,server,temporal]",  # every extra's tests run in CI
    "httpx==0.28.1",  # the HTTP shell's tests call the app in process (httpx.ASGITransport)
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv.sources]
lite-eval = { url = "https://github.com/ArthurGao/lite-eval/releases/download/v0.4.1/lite_eval-0.4.1-py3-none-any.whl" }

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The eval tasks are half Chinese: full-width punctuation is their content, not a typo.
"src/lite_agent/evals/*" = ["RUF001"]
"tests/unit/test_eval_tasks.py" = ["RUF001"]

[tool.ruff.format]
# Code blocks in docs are hand-aligned illustrations, not code.
exclude = ["*.md"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Opt-in, deselected by default: `uv run pytest -m ollama` (the real Ollama on the host).
addopts = "-m 'not ollama'"
markers = [
    "ollama: talks to the real local Ollama (opt-in: uv run pytest -m ollama)",
    "temporal: runs on Temporal's time-skipping test server (local; downloaded once; runs by default)",
]
